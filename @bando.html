                  <script>
                    // not used :P
                    function addGlowLine(selector, {
                      color = '#ff2a2a',
                      thickness = 6,
                      blur = 16,
                      position = 'top'
                    } = {}) {
                      const el = document.querySelector(selector);
                      if (!el) return;
                      // ensure positioning context
                      const computedPos = getComputedStyle(el).position;
                      if (computedPos === 'static') el.style.position = 'relative';
                      // make or reuse the line
                      let line = el.querySelector(':scope > .glow-line');
                      if (!line) {
                        line = document.createElement('div');
                        line.className = 'glow-line';
                        el.appendChild(line);
                      }
                      line.style.setProperty('--glow-color', color);
                      line.style.setProperty('--glow-thickness', thickness + 'px');
                      line.style.setProperty('--glow-blur', blur + 'px');
                      line.style.top = position === 'top' ? '0' : '';
                      line.style.bottom = position === 'bottom' ? '0' : '';
                      line.style.transform = position === 'top' ? 'translateY(-50%)' : 'translateY(50%)';
                    }
                    document.addEventListener('DOMContentLoaded', () => {
                      addGlowLine('.container.style3', {
                        color: '#ff2d2d',
                        thickness: 6,
                        blur: 18,
                        position: 'top'
                      });
                    });
