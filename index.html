<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    const targetBase = "https://the11view.xyz";
    const newUrl = targetBase + window.location.pathname + window.location.search + window.location.hash;

    window.location.replace(newUrl);
  </script>
</head>
<body>
  <h1>Redirecting you...</h1>
  <p>If you are not redirected, <a id="redirectLink" href="#">click here</a>.</p>
  <script>
    document.getElementById("redirectLink").href = newUrl;
  </script>
</body>
</html>
